version: "3.9"

services:
  agentic-tax-calculator:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TAX_CALC_DEPLOYMENT_MODE=kubernetes
      - TAX_CALC_DATA_SOURCE_MODE=mock
      - TAX_CALC_DYNAMODB_TABLE_NAME=tax-calc-shared-state
      - TAX_CALC_MEMORY_TABLE_NAME=tax-calc-memory
      - TAX_CALC_AWS_REGION=us-east-1
      - TAX_CALC_LOG_LEVEL=DEBUG
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DISABLE_ADOT_OBSERVABILITY=true
    depends_on:
      dynamodb-local:
        condition: service_healthy

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot container to create DynamoDB tables on startup
  dynamodb-init:
    image: amazon/aws-cli:latest
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    entrypoint: /bin/sh
    command:
      - -c
      - |
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name tax-calc-shared-state \
          --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
          --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name tax-calc-memory \
          --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
          --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

        echo "DynamoDB tables created."
    depends_on:
      dynamodb-local:
        condition: service_healthy
